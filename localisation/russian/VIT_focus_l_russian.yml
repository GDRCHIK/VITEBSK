 VITF_fury_spirit:0 "Праведный гнев Витебска"
 VITF_fury_spirit_desc:0 "Отказ Москвы разбудил в нас дух, которого не победить."
 VIT_appeal_opinion:0 "Обращение Витебска"
 VIT_decisions:0 "Решения Витебска"
 VIT_decisions_desc:0 "Дипломатические решения Витебска."
 VIT_join_axis:0 "Присоединиться к Оси"
 VIT_join_axis_desc:0 "Дверь в Ось открыта. Если Германия состоит в фракции, Витебск может вступить."
 VIT_join_allies:0 "Присоединиться к союзникам"
 VIT_join_allies_desc:0 "Свободный мир готов принять нас. Если Британия состоит в фракции, Витебск может вступить."
 vit_belarus.1.t:0 "Требование Витебска"
 vit_belarus.1.d:0 "Витебск выдвинул требование: вернуть белорусские земли, принадлежавшие ему исторически. Витебск готов взять их мирно или силой."
 vit_belarus.1.a:0 "Отдать земли"
 vit_belarus.1.b:0 "Отказать. Пусть приходят"
 vit_belarus.2.t:0 "Москва согласилась"
 vit_belarus.2.d:0 "СССР уступил белорусские земли без боя. Витебск расширил свои границы."
 vit_belarus.2.a:0 "Победа!"
 vit_belarus.3.t:0 "Москва отказала"
 vit_belarus.3.d:0 "СССР отверг наше требование. Теперь нас ничто не остановит. Витебск вступает в войну, и дух народа непобедим."
 vit_belarus.3.a:0 "К оружию!"
 VIT_latvia_ultimatum:0 "Ультиматум Латвии"
 VIT_latvia_ultimatum_desc:0 "Потребовать у Латвии присоединения: нам нужен выход к морю."
 vit_latvia.1.t:0 "Ультиматум Витебска"
 vit_latvia.1.d:0 "Витебск потребовал, чтобы Латвия вошла в его состав. Отказ означает войну."
 vit_latvia.1.a:0 "Согласиться"
 vit_latvia.1.b:0 "Отказаться"
 vit_latvia.2.t:0 "Латвия согласилась"
 vit_latvia.2.d:0 "Латвия вошла в состав Витебска. Теперь у нас есть выход к морю."
 vit_latvia.2.a:0 "Море наше!"
 vit_latvia.3.t:0 "Латвия отказала"
 vit_latvia.3.d:0 "Латвия отвергла ультиматум. У нас есть цель для объявления войны, а дорога к флоту открыта."
 vit_latvia.3.a:0 "Понятно"
 VIT_pistoletov:0 "Пистолетов"
 VIT_navy_engineer:0 "Винтов"
 VIT_navy_engineer_desc:0 "Главный инженер флота."
 VIT_navy_engineer_trait:0 "Главный инженер"
 VIT_navy_engineer_trait_desc:0 "Ускоряет опыт флота и работу верфей."
 VITF_G1:0 "Немецкое сотрудничество"
 VITF_G1_desc:0 "Берлин готов говорить с Витебском."
 VITF_G2:0 "Немецкие танки"
 VITF_G2_desc:0 "Первые машины из Германии прибывают на склады."
 VITF_G3:0 "Люфтваффе нам помогут!"
 VITF_G3_desc:0 "Немецкие самолёты и инструкторы над Витебском."
 VITF_G4:0 "Немецкие солдаты"
 VITF_G4_desc:0 "Немецкие инструкторы и оружие для нашей армии."
 VITF_C1:0 "Вступить в Коминтерн"
 VITF_C1_desc:0 "Витебск присоединяется к общему делу."
 VITF_C2:0 "Здравствуйте, товарищи!"
 VITF_C2_desc:0 "Москва принимает нас как родных."
 VITF_C3:0 "Совместное производство"
 VITF_C3_desc:0 "Витебские и советские заводы работают вместе."
 VITF_C4:0 "Советские учёные"
 VITF_C4_desc:0 "Московские специалисты приезжают в Витебск."
 VITF_C5:0 "Монгольское продовольствие"
 VITF_C5_desc:0 "Из степей идут поставки мяса и зерна."
 VITF_T1:0 "Витебское производство танков"
 VITF_T1_desc:0 "Первые, пусть и самые простые, витебские танки."
 VITF_T2:0 "Доработать чертежи"
 VITF_T2_desc:0 "Инженеры правят то, что досталось."
 VITF_T3:0 "Что есть = то есть"
 VITF_T3_desc:0 "Воюем тем, что построили."
 VITF_T4:0 "Относительно прекрасные машины!"
 VITF_T4_desc:0 "Лучше не бывало, но и такие сойдут."
 VITF_P1:0 "Наше небо!"
 VITF_P1_desc:0 "Витебск строит собственную авиацию."
 VITF_P2:0 "Витебские кукурузники"
 VITF_P2_desc:0 "Фанерные бипланы с хорошим характером."
 VITF_P3:0 "Выйти на новый уровень"
 VITF_P3_desc:0 "Авиаторы хотят большего."
 VITF_P4:0 "Бомбардировщики?"
 VITF_P4_desc:0 "Раз уж есть небо, почему бы не бомбить."
 VITF_P5:0 "От винта!"
 VITF_P5_desc:0 "Взлёт! Теперь только вперёд."
 VIT_german_opinion:0 "Сотрудничество с Германией"
 VIT_friendship_opinion:0 "Дружеские связи"
 vit_alliance.1.t:0 "Витебск просит союза"
 vit_alliance.1.d:0 "Витебск обратился к Великобритании с просьбой принять его в союз. Мы можем согласиться или отказать."
 vit_alliance.1.a:0 "Принять Витебск"
 vit_alliance.1.b:0 "Отказать"
 vit_alliance.2.t:0 "Великобритания приняла нас"
 vit_alliance.2.d:0 "Лондон согласился принять Витебск в союз."
 vit_alliance.2.a:0 "Отлично!"
 vit_alliance.3.t:0 "Великобритания отказала"
 vit_alliance.3.d:0 "Лондон отклонил нашу просьбу о союзе."
 vit_alliance.3.a:0 "Понятно"
 vit_alliance.4.t:0 "Витебск просит вступить в Ось"
 vit_alliance.4.d:0 "Витебск просит принять его в Ось. Мы можем согласиться или отказать."
 vit_alliance.4.a:0 "Принять Витебск"
 vit_alliance.4.b:0 "Отказать"
 vit_alliance.5.t:0 "Германия приняла нас"
 vit_alliance.5.d:0 "Берлин согласился принять Витебск в Ось."
 vit_alliance.5.a:0 "Отлично!"
 vit_alliance.6.t:0 "Германия отказала"
 vit_alliance.6.d:0 "Берлин отклонил нашу просьбу о вступлении в Ось."
 vit_alliance.6.a:0 "Понятно"
