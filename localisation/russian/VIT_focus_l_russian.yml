l_russian:
 VITF_START:0 "Будущее Витебска"
 VITF_START_desc:0 "Витебск свободен. Но какой путь он выберет?"
 VITF_R1:0 "Начало перевооружения"
 VITF_R1_desc:0 "Станки грохочут, склады пополняются."
 VITF_R2:0 "Созвать людей на службу"
 VITF_R2_desc:0 "Каждому — винтовку и шинель."
 VITF_R3:0 "Вторая волна перевооружения"
 VITF_R3_desc:0 "Новые заводы, новое оружие."
 VITF_R4:0 "Независимая армия"
 VITF_R4_desc:0 "Свои генералы, свои приказы, свои победы."
 VITF_R5:0 "Последняя волна перевооружения"
 VITF_R5_desc:0 "Лучшее оружие из лучших цехов."
 VITF_R6:0 "Непобедимая армия"
 VITF_R6_desc:0 "Враги трепещут, союзники завидуют."
 VITF_I1:0 "Заняться промышленностью великой державы"
 VITF_I1_desc:0 "Витебск не хуже любой столицы."
 VITF_I2:0 "Отголоски СССР"
 VITF_I2_desc:0 "Мы помним, как строили заводы-гиганты."
 VITF_I3:0 "Независимая промышленность"
 VITF_I3_desc:0 "Ни от кого не зависим."
 VITF_I4:0 "Подумать о качестве"
 VITF_I4_desc:0 "Не количеством, а умением."
 VITF_I5:0 "Лучшая промышленность!"
 VITF_I5_desc:0 "Мировой уровень, витебская марка."
 VITF_I6:0 "Развить север"
 VITF_I6_desc:0 "Новые цеха на северных окраинах."
 VITF_I7:0 "Развить юг"
 VITF_I7_desc:0 "Фабрики растут и на юге."
 VITF_I8:0 "Промышленная интеграция в других странах"
 VITF_I8_desc:0 "Витебские заводы работают по всему региону."
 VITF_I9:0 "Заняться инфраструктурой"
 VITF_I9_desc:0 "Дороги, мосты, рельсы."
 VITF_I10:0 "Осушить болота"
 VITF_I10_desc:0 "Топи станут землёй для заводов."
 VITF_K1:0 "Бывший владелец — главный союзник"
 VITF_K1_desc:0 "Старая вражда забыта: Москва — наш щит."
 VITF_K2:0 "Ставка на коммунизм"
 VITF_K2_desc:0 "Партия решила: быть по сему."
 VITF_K3:0 "Коммунистическая пропаганда"
 VITF_K3_desc:0 "Плакаты на каждой стене."
 VITF_K4:0 "Нам не нужны другие партии!"
 VITF_K4_desc:0 "Одна партия — одна воля."
 VITF_K5:0 "Вставай, пролетарий!"
 VITF_K5_desc:0 "Нас миллионы, мы непобедимы."
 VITF_N1:0 "Бывший владелец — враг номер один"
 VITF_N1_desc:0 "Старые счёты ещё не оплачены."
 VITF_N2:0 "Заручиться поддержкой художника"
 VITF_N2_desc:0 "Кисть в руках бывает опаснее меча."
 VITF_N3:0 "Долой пролетариат!"
 VITF_N3_desc:0 "Рабочий должен знать своё место."
 VITF_N4:0 "Долой монархию!"
 VITF_N4_desc:0 "Ни князей, ни королей — только вождь."
 VITF_N5:0 "Вступить в Ось"
 VITF_N5_desc:0 "Нас ждут в Берлине: дверь в Ось открыта."
 VITF_N6:0 "Притязания на Белоруссию"
 VITF_N6_desc:0 "Эти земли были нашими. Москва должна вернуть их — по-хорошему или по-плохому."
 focus1:0 "Четырехлетний план"
 focus1_desc:0 "Страна приступает к плановому развитию на ближайшие годы."
 focus2:0 "Строительство гражданских фабрик"
 focus2_desc:0 "Новые гражданские фабрики для молодого государства."
 focus3:0 "Модернизация советских военных заводов"
 focus3_desc:0 "Старые советские заводы получают новое оборудование."
 VITF_N7:0 "Притязания на Польшу"
 VITF_N7_desc:0 "Земли, которые Польша забрала у нас, должны вернуться: Полесье и Белосток."
 VITF_S1:0 "Море!"
 VITF_S1_desc:0 "Выход к морю открыт. Пора строить флот."
 VITF_S2:0 "Эксперименты с флотом"
 VITF_S2_desc:0 "Проверим всё, что плавает и стреляет."
 VITF_S3:0 "Сделаем из того, что есть..."
 VITF_S3_desc:0 "Из старых корпусов и чужих деталей выйдет что-то своё."
 VITF_S4:0 "Визит Пистолетова"
 VITF_S4_desc:0 "Знаменитый конструктор приезжает с чертежами и идеями."
 VITF_S5:0 "Собрать первый корабль"
 VITF_S5_desc:0 "Первый корабль витебского флота сходит со стапелей."
 VITF_S6:0 "Прекрасная машина!"
 VITF_S6_desc:0 "Корабль, которым гордится вся страна."
 VITF_D1:0 "Путь мирного Витебска"
 VITF_D1_desc:0 "Мир и закон — вот наша дорога."
 VITF_D2:0 "Обратиться к Великобритании"
 VITF_D2_desc:0 "Лондон слышит голос Витебска."
 VITF_D3:0 "Обратиться к Франции"
 VITF_D3_desc:0 "Париж готов выслушать."
 VITF_D4:0 "Красная угроза"
 VITF_D4_desc:0 "Москва тянет лапы к нашей земле."
 VITF_D5:0 "Мы хотим в союзники!"
 VITF_D5_desc:0 "Свободный мир примет нас."
 VITF_M1:0 "Вспомним прошлое!"
 VITF_M1_desc:0 "Когда-то Витебском правили князья."
 VITF_M2:0 "Долой другие партии!"
 VITF_M2_desc:0 "Князь выше партийных склок."
 VITF_M3:0 "Монархистические настроения"
 VITF_M3_desc:0 "Народ вспоминает княжеские времена."
 VITF_M4:0 "Монархистические пропаганды"
 VITF_M4_desc:0 "Князь на каждой афише."
 VITF_M5:0 "Да здравствует князь!"
 VITF_M5_desc:0 "Князь вступает на отцовский стол."
