VITF_EGYPT_FREEDOM:0 "Свобода колониям"
 VITF_EGYPT_FREEDOM_desc:0 "Британский империализм веками душил народы Африки. Мы потребуем от Лондона немедленно освободить Египет и дать ему независимость. Если они откажут — мы сами решим этот вопрос."
 
 VITF_EGYPT_BUY:0 "Прибрать Египет к рукам"
 VITF_EGYPT_BUY_desc:0 "Египет наконец свободен, но он слишком слаб, чтобы выжить в одиночку. Мы предложим им нашу защиту и интеграцию в нашу сферу влияния. Их ресурсы и Суэцкий канал будут служить нам.